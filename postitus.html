<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogipostitus | MinuInvesteeringud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .post-container { max-width: 800px; background: white; padding: 40px; border-radius: 12px; margin: 40px auto; border: 1px solid var(--border-color); }
        .post-header { margin-bottom: 30px; text-align: center; }
        .post-meta { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }
        .post-main-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 30px; }
        .post-content { font-size: 1.1rem; line-height: 1.8; color: #334155; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container nav-content">
            <a href="index.html" class="logo">MinuInvesteeringud</a>
            <nav>
                <ul>
                    <li><a href="index.html">Avaleht</a></li>
                    <li><a href="blog.html">Blogi</a></li>
                    <li><a href="kalkulaator.html">Kalkulaator</a></li>
                    <li><a href="login.html" class="btn-login">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <article class="post-container" id="post-wrapper">
            <!-- Postituse sisu laetakse dünaamiliselt -->
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 MinuInvesteeringud. Kõik õigused kaitstud.</p>
        </div>
    </footer>

    <script>
        function loadSinglePost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = parseInt(urlParams.get('id'));
            const posts = JSON.parse(localStorage.getItem('my_blog_posts')) || [];
            const post = posts.find(p => p.id === postId);

            const wrapper = document.getElementById('post-wrapper');
            if (post) {
                document.title = `${post.title} | MinuInvesteeringud`;
                wrapper.innerHTML = `
                    <div class="post-header">
                        <span class="blog-badge">${post.category}</span>
                        <h1 style="font-size: 2.5rem; margin-top: 10px;">${post.title}</h1>
                        <div class="post-meta">Avaldatud: ${post.date}</div>
                    </div>
                    <img src="${post.image}" class="post-main-img" alt="${post.title}">
                    <div class="post-content">${post.content.replace(/\n/g, '<br><br>')}</div>
                `;
            } else {
                wrapper.innerHTML = `<h2>Postitust ei leitud!</h2><br><a href="blog.html" class="btn">Tagasi blogisse</a>`;
            }
        }
        loadSinglePost();
    </script>
</body>
</html>
