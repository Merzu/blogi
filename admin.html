<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Juhtpaneel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background: #1e293b; padding: 25px; border-right: 1px solid #334155; }
        .sidebar h2 { color: #10b981; margin-bottom: 30px; font-size: 1.2rem; }
        .menu { list-style: none; }
        .menu li { margin-bottom: 12px; }
        .menu a { color: #94a3b8; text-decoration: none; font-weight: 600; display: block; padding: 10px; border-radius: 6px; }
        .menu a.active, .menu a:hover { background: #334155; color: white; }
        
        .main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .card { background: #1e293b; padding: 25px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 1rem; }
        .form-group textarea { height: 150px; }
        
        .btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #059669; }
        .btn-danger { background: #ef4444; padding: 6px 12px; font-size: 0.85rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .preview-img { max-width: 100px; max-height: 60px; border-radius: 4px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Admin Paneel</h2>
        <ul class="menu">
            <li><a href="#" class="active">Lisa Postitus</a></li>
            <li><a href="index.html" target="_blank">Vaata Veebilehte &nearr;</a></li>
            <li><a href="#" onclick="logout()" style="color: #ef4444; margin-top: 40px;">Logi välja</a></li>
        </ul>
    </aside>

    <main class="main">
        <h1 style="margin-bottom: 30px;">Uue artikli lisamine</h1>

        <div class="card">
            <form id="addPostForm">
                <div class="form-group">
                    <label>Pealkiri</label>
                    <input type="text" id="postTitle" placeholder="Nt: Minu augustikuu portfelli ülevaade" required>
                </div>
                <div class="form-group">
                    <label>Kategooria</label>
                    <select id="postCategory">
                        <option value="Aktsiad">Aktsiad</option>
                        <option value="Säästmine">Säästmine</option>
                        <option value="Kinnisvara">Kinnisvara</option>
                        <option value="Ülevaated">Portfelli Ülevaated</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Pilt (Lae arvutist fail või pane veebi URL)</label>
                    <input type="file" id="postImageFile" accept="image/*" onchange="convertImageToBase64(event)">
                    <input type="url" id="postImageUrl" placeholder="Või kleebi pildi URL siia..." style="margin-top: 10px;">
                    <img id="imgPreview" class="preview-img" alt="Pildi eelvaade">
                </div>
                <div class="form-group">
                    <label>Postituse Lühikokkuvõte (Kuvatakse kaardil)</label>
                    <input type="text" id="postSummary" placeholder="Lühike sissejuhatus..." required>
                </div>
                <div class="form-group">
                    <label>Täielik Sisu</label>
                    <textarea id="postContent" placeholder="Kirjuta siia pikem tekst..." required></textarea>
                </div>
                <button type="submit" class="btn">Avalda Artikkel</button>
            </form>
        </div>

        <h2>Olemasolevad artiklid</h2>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Pealkiri</th>
                        <th>Kategooria</th>
                        <th>Kuupäev</th>
                        <th>Tegevus</th>
                    </tr>
                </thead>
                <tbody id="adminPostsTable">
                    <!-- Postituste tabel -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Turvakontroll
        if(localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        let base64Image = '';

        function convertImageToBase64(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    const preview = document.getElementById('imgPreview');
                    preview.src = base64Image;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('addPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const posts = JSON.parse(localStorage.getItem('my_blog_posts')) || [];

            const imageUrl = base64Image || document.getElementById('postImageUrl').value || 'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=800';

            const newPost = {
                id: Date.now(),
                title: document.getElementById('postTitle').value,
                category: document.getElementById('postCategory').value,
                summary: document.getElementById('postSummary').value,
                content: document.getElementById('postContent').value,
                image: imageUrl,
                date: new Date().toLocaleDateString('et-EE')
            };

            posts.unshift(newPost);
            localStorage.setItem('my_blog_posts', JSON.stringify(posts));

            alert('Postitus on edukalt lisatud ja veebilehel nähtav!');
            this.reset();
            document.getElementById('imgPreview').style.display = 'none';
            base64Image = '';
            renderTable();
        });

        function renderTable() {
            const posts = JSON.parse(localStorage.getItem('my_blog_posts')) || [];
            const tbody = document.getElementById('adminPostsTable');
            tbody.innerHTML = '';

            posts.forEach(post => {
                tbody.innerHTML += `
                    <tr>
                        <td>${post.title}</td>
                        <td>${post.category}</td>
                        <td>${post.date}</td>
                        <td><button class="btn btn-danger" onclick="deletePost(${post.id})">Kustuta</button></td>
                    </tr>
                `;
            });
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('my_blog_posts')) || [];
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('my_blog_posts', JSON.stringify(posts));
            renderTable();
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        }

        renderTable();
    </script>
</body>
</html>
