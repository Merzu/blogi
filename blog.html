<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahamägi | Blogi</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>

    <!-- Quill.js - Võimaldab lisada pilte ja vormindada teksti teksti vahel -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        .blog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .post-card:hover {
            transform: translateY(-4px);
            border-color: #475569;
        }

        .post-card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .post-title {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .post-excerpt {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 20px;
            flex: 1;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: auto;
        }

        /* Modal redaktori jaoks */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            color: white;
        }

        /* Quilli redaktori tumeda teema kohandus */
        .ql-toolbar { background: #0f172a; border-color: var(--border-color) !important; border-radius: 6px 6px 0 0; }
        .ql-container { background: #0f172a; border-color: var(--border-color) !important; border-radius: 0 0 6px 6px; color: white; font-size: 1rem; min-height: 200px; }
        .ql-stroke { stroke: #cbd5e1 !important; }
        .ql-fill { fill: #cbd5e1 !important; }
        .ql-picker { color: #cbd5e1 !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container nav-content">
            <a href="index.html" class="logo-link">
                <img src="rahamagi_logo_official.png" alt="Rahamägi Logo" class="site-logo">
            </a>
            <nav><ul id="main-nav-links"></ul></nav>
        </div>
    </header>

    <main class="container" style="padding-top: 40px;">
        <div class="blog-header">
            <div>
                <h1 style="color: var(--accent-gold); margin-bottom: 5px;">📰 Rahamägi Blogi</h1>
                <p style="color: var(--text-muted);">Mõtted investeerimisest, finantsvabadusest ja portfelli käekäigust.</p>
            </div>
            <div id="admin-add-btn-container"></div>
        </div>

        <!-- POSTITUSTE RUUDUSTIK -->
        <div id="posts-container" class="posts-grid"></div>
    </main>

    <!-- ADMINI POSTITUSE MODAL (UUS / MUUDA) -->
    <div id="post-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 20px; color: var(--accent-gold);">Uus Postitus</h2>
            <form id="post-form">
                <input type="hidden" id="edit-post-id">
                
                <div style="margin-bottom: 15px;">
                    <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Pealkiri</label>
                    <input type="text" id="post-title-input" required placeholder="Sisesta postituse pealkiri" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Lühikirjeldus (kuvatakse kaartidel)</label>
                    <textarea id="post-excerpt-input" required placeholder="Lühike kokkuvõte..." rows="2" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;"></textarea>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:5px;">Sisu (saad teksti vahele lisada pilte 🖼️ nuppudest)</label>
                    <div id="quill-editor"></div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" onclick="closeModal()" class="btn" style="background:transparent; border:1px solid var(--border-color);">Tühista</button>
                    <button type="submit" class="btn">Salvesta Postitus 💾</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('rahamagi_user'));
        const isAdmin = currentUser?.role === 'admin';

        // Näidispostitused (kui localStorage on tühi)
        const defaultPosts = [
            {
                id: "101",
                date: "2026-09-01",
                title: "Kuidas alustasin portfelli kasvatamist 2026. aastal",
                excerpt: "Esimene ülevaade minu eesmärkidest, strateegiast ning varade jaotusest.",
                content: "<p>Tere tulemast minu blogisse! Siin teekonnal jagan avameelselt oma samme investeerimismaailmas.</p><p>Minu peamine fookus on laiapõhjalistel ETF-idel ja dividendiaktsiatel.</p><p><img src='https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=80'></p><p>Pildil on näha turu liikumist. Oluline on hoida külma närvi ja investeerida regulaarselt iga kuu!</p>"
            }
        ];

        let posts = JSON.parse(localStorage.getItem('rahamagi_posts')) || defaultPosts;

        // Initsialiseeri Quill editor
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'], // Piltide lisamise nupp
                    ['clean']
                ]
            }
        });

        // Kuva Admini "+ Uus Postitus" nupp
        if (isAdmin) {
            document.getElementById('admin-add-btn-container').innerHTML = `
                <button onclick="openModal()" class="btn">+ Lisa Uus Postitus ✏️</button>
            `;
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Postitusi veel pole.</p>';
                return;
            }

            // Sorteeri uuemad ettepoole
            const sorted = [...posts].sort((a,b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-card-content">
                        <div class="post-date">🗓️ ${post.date}</div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-excerpt">${post.excerpt}</p>
                        
                        <div class="post-actions">
                            <a href="post.html?id=${post.id}" class="btn" style="padding: 6px 14px; font-size: 0.85rem;">Loe edasi ➔</a>
                            
                            ${isAdmin ? `
                                <div style="display:flex; gap:6px;">
                                    <button onclick="editPost('${post.id}')" class="btn" style="padding: 4px 10px; font-size:0.8rem; background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold);">✏️ Muuda</button>
                                    <button onclick="deletePost('${post.id}')" class="btn" style="padding: 4px 10px; font-size:0.8rem; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;">🗑️</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(editId = null) {
            document.getElementById('post-modal').style.display = 'flex';
            if (editId) {
                const p = posts.find(item => item.id === editId);
                document.getElementById('modal-title').innerText = 'Muuda Postitust';
                document.getElementById('edit-post-id').value = p.id;
                document.getElementById('post-title-input').value = p.title;
                document.getElementById('post-excerpt-input').value = p.excerpt;
                quill.root.innerHTML = p.content || '';
            } else {
                document.getElementById('modal-title').innerText = 'Uus Postitus';
                document.getElementById('edit-post-id').value = '';
                document.getElementById('post-title-input').value = '';
                document.getElementById('post-excerpt-input').value = '';
                quill.root.innerHTML = '';
            }
        }

        function closeModal() {
            document.getElementById('post-modal').style.display = 'none';
        }

        document.getElementById('post-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const editId = document.getElementById('edit-post-id').value;
            const title = document.getElementById('post-title-input').value.trim();
            const excerpt = document.getElementById('post-excerpt-input').value.trim();
            const content = quill.root.innerHTML;

            if (editId) {
                // Muuda olemasolevat
                const idx = posts.findIndex(p => p.id === editId);
                if (idx !== -1) {
                    posts[idx].title = title;
                    posts[idx].excerpt = excerpt;
                    posts[idx].content = content;
                }
            } else {
                // Lisa uus postitus
                const newPost = {
                    id: Date.now().toString(),
                    date: new Date().toISOString().split('T')[0],
                    title,
                    excerpt,
                    content
                };
                posts.push(newPost);
            }

            localStorage.setItem('rahamagi_posts', JSON.stringify(posts));
            closeModal();
            renderPosts();
        });

        function editPost(id) {
            openModal(id);
        }

        function deletePost(id) {
            if (!isAdmin) return;
            if (confirm('Kas oled kindel, et soovid selle postituse kustutada?')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('rahamagi_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        renderPosts();
    </script>
</body>
</html>
