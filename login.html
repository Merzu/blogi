<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahamägi | Sisselogimine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

    <div class="card" style="max-width: 440px; width: 100%; text-align: center; padding: 40px 30px;">
        <img src="rahamagi_logo_official.png" alt="Logo" style="height: 70px; margin-bottom: 15px; border-radius: 12px;">
        <h2 style="margin-bottom: 8px;">Sisselogimine</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Sisesta oma kasutajanimi ja parool.</p>

        <!-- PAROOLIGA SISSELOGIMISE VORM -->
        <form id="login-form" style="text-align: left; margin-bottom: 20px;">
            <div style="margin-bottom: 12px;">
                <label style="display:block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">Kasutajanimi</label>
                <input type="text" id="username" required placeholder="Kasutajanimi" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">Parool</label>
                <input type="password" id="password" required placeholder="••••••••" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>
            <p id="error-msg" style="color: #ef4444; font-size: 0.85rem; display: none; margin-bottom: 10px;">Vale kasutajanimi või parool!</p>
            <button type="submit" class="btn" style="width: 100%;">Logi Sisse 🔑</button>
        </form>

        <div style="border-top: 1px solid var(--border-color); padding-top: 18px; margin-top: 18px;">
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Soovid vaadata ainult avalikku osa?</p>
            <button onclick="loginAsGuest()" class="btn" style="width: 100%; background: transparent; border: 1px solid var(--accent-green); color: var(--accent-green);">Jätka Tava-Külalisena 👤</button>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === 'admin' && p === 'admin123') {
                localStorage.setItem('rahamagi_user', JSON.stringify({ role: 'admin', name: 'Admin' }));
                window.location.href = 'index.html';
            } else if (u === 'specialguest' && p === 'special123') {
                localStorage.setItem('rahamagi_user', JSON.stringify({ role: 'specialguest', name: 'Eri-Külaline' }));
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        });

        function loginAsGuest() {
            localStorage.setItem('rahamagi_user', JSON.stringify({ role: 'guest', name: 'Külaline' }));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
