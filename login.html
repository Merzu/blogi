<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahamägi | Admin Sisselogimine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container nav-content">
            <a href="index.html" class="logo-link">
                <img src="rahamagi_logo_official.png" alt="Rahamägi Logo" class="site-logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Avaleht</a></li>
                    <li><a href="blog.html">Blogi</a></li>
                    <li><a href="portfell.html">Portfell</a></li>
                    <li><a href="kalkulaator.html">Kalkulaator</a></li>
                    <li><a href="login.html" class="btn-login active">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 60px;">
        <div class="card" style="max-width: 400px; margin: 0 auto;">
            <h3 style="margin-bottom: 20px; text-align: center;">🔒 Admin SISSELOGIMINE</h3>
            <form onsubmit="event.preventDefault(); alert('Sisse logitud!');">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Kasutajanimi</label>
                    <input type="text" required style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Parool</label>
                    <input type="password" required style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Logi Sisse</button>
            </form>
        </div>
    </main>

</body>
