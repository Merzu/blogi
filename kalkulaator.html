<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinuInvesteeringud | Kalkulaator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .calc-wrapper { max-width: 600px; background: white; padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; }
        .result-box { margin-top: 30px; padding: 20px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; text-align: center; }
        .result-title { font-size: 0.9rem; color: #065f46; font-weight: bold; }
        .result-val { font-size: 2rem; font-weight: 800; color: var(--accent-color); margin-top: 5px; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container nav-content">
            <a href="index.html" class="logo">MinuInvesteeringud</a>
            <nav>
                <ul>
                    <li><a href="index.html">Avaleht</a></li>
                    <li><a href="blog.html">Blogi</a></li>
                    <li><a href="kalkulaator.html" class="active">Kalkulaator</a></li>
                    <li><a href="login.html" class="btn-login">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container">
        <h1 class="section-title">Liitintressi Kalkulaator</h1>
        <div class="calc-wrapper">
            <div class="form-group">
                <label>Algsumma (€)</label>
                <input type="number" id="startAmount" value="1000">
            </div>
            <div class="form-group">
                <label>Igakuine sissemakse (€)</label>
                <input type="number" id="monthlyAdd" value="200">
            </div>
            <div class="form-group">
                <label>Eeldatav aastane tootlus (%)</label>
                <input type="number" id="interestRate" value="8">
            </div>
            <div class="form-group">
                <label>Periood (aastates)</label>
                <input type="number" id="years" value="15">
            </div>
            <button class="btn" style="width: 100%;" onclick="calculate()">Arvuta tulemus</button>

            <div class="result-box">
                <div class="result-title">TULEVANE PORTFELLI VÄÄRTUS</div>
                <div class="result-val" id="finalResult">0 €</div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 MinuInvesteeringud. Kõik õigused kaitstud.</p>
        </div>
    </footer>

    <script>
        function calculate() {
            const start = parseFloat(document.getElementById('startAmount').value) || 0;
            const monthly = parseFloat(document.getElementById('monthlyAdd').value) || 0;
            const rate = (parseFloat(document.getElementById('interestRate').value) || 0) / 100 / 12;
            const months = (parseInt(document.getElementById('years').value) || 0) * 12;

            let total = start;
            for (let i = 0; i < months; i++) {
                total = total * (1 + rate) + monthly;
            }

            document.getElementById('finalResult').innerText = Math.round(total).toLocaleString('et-EE') + ' €';
        }
        calculate();
    </script>
</body>
</html>
