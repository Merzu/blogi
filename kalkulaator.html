<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahamägi | Kalkulaator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container nav-content">
            <a href="index.html" class="logo-link">
                <img src="rahamagi_logo_official.png" alt="Rahamägi Logo" class="site-logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Avaleht</a></li>
                    <li><a href="blog.html">Blogi</a></li>
                    <li><a href="portfell.html">Portfell</a></li>
                    <li><a href="kalkulaator.html" class="active">Kalkulaator</a></li>
                    <li><a href="login.html" class="btn-login">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 40px;">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 20px; color: var(--accent-gold);">🧮 Liitintressi Kalkulaator</h2>
            
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Algsumma (€):</label>
                <input type="number" id="calc-start" value="1000" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Igakuine sissemakse (€):</label>
                <input type="number" id="calc-monthly" value="200" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Oodatav tootlus aastas (%):</label>
                <input type="number" id="calc-rate" value="8" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">Periood (aastates):</label>
                <input type="number" id="calc-years" value="10" style="width:100%; padding:10px; background:#0f172a; border:1px solid var(--border-color); color:white; border-radius:6px;">
            </div>

            <button onclick="calculate()" class="btn" style="width: 100%;">Arvuta Tulemus</button>

            <div id="result" style="margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 8px; text-align: center; display: none;">
                <span style="color: var(--text-muted);">Tulevikuväärtus:</span>
                <h2 id="result-value" style="color: var(--accent-green); font-size: 2rem;">0 €</h2>
            </div>
        </div>
    </main>

    <script>
        function calculate() {
            const start = parseFloat(document.getElementById('calc-start').value) || 0;
            const monthly = parseFloat(document.getElementById('calc-monthly').value) || 0;
            const rate = (parseFloat(document.getElementById('calc-rate').value) || 0) / 100 / 12;
            const months = (parseInt(document.getElementById('calc-years').value) || 0) * 12;

            let total = start;
            for (let i = 0; i < months; i++) {
                total = (total + monthly) * (1 + rate);
            }

            document.getElementById('result-value').innerText = total.toLocaleString('et-EE', {maximumFractionDigits: 2}) + ' €';
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
